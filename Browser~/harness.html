<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deucarian Web Viewer Harness</title>
  <style>
    :root { color-scheme: dark; font: 15px Inter, system-ui, sans-serif; }
    body { margin: 0; background: #07101f; color: #e9f1ff; }
    header { padding: 18px 22px; border-bottom: 1px solid #243550; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0; color: #9fb1cb; }
    main { display: grid; grid-template-columns: minmax(480px, 1fr) 360px; min-height: calc(100vh - 82px); }
    iframe { width: 100%; height: 100%; min-height: 680px; border: 0; background: #111827; }
    aside { padding: 18px; border-left: 1px solid #243550; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { padding: 10px 12px; border: 1px solid #35547d; border-radius: 8px; background: #152a47; color: inherit; cursor: pointer; }
    button:hover { background: #1c3a64; }
    pre { margin-top: 16px; height: 480px; overflow: auto; white-space: pre-wrap; color: #abc5ec; }
  </style>
</head>
<body>
  <header>
    <h1>Deucarian Web Viewer</h1>
    <p>Local production-transport harness. Serve this directory over HTTP.</p>
  </header>
  <main>
    <iframe id="viewer" src="./Build/index.html" title="Web Viewer"></iframe>
    <aside>
      <div class="actions">
        <button id="initialize">Initialize</button>
        <button id="red">Select red</button>
        <button id="green-blue">Green + blue</button>
        <button id="clear">Clear</button>
        <button id="invalid">Invalid ID</button>
        <button id="stale">Stale revision</button>
        <button id="dispose">Dispose</button>
      </div>
      <pre id="events" aria-live="polite"></pre>
    </aside>
  </main>
  <script type="module" src="./harness.js"></script>
</body>
</html>
