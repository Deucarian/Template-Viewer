<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deucarian Web Viewer Harness</title>
  <style>
    :root { color-scheme: dark; font: 15px Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #07101f; color: #e9f1ff; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #243550; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0; color: #9fb1cb; }
    main { display: grid; grid-template-columns: minmax(480px, 1fr) 390px; min-height: calc(100vh - 82px); }
    iframe { width: 100%; height: 100%; min-height: 680px; border: 0; background: #111827; }
    aside { padding: 18px; border-left: 1px solid #243550; overflow: auto; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .actions { display: grid; gap: 8px; }
    button { padding: 10px 12px; border: 1px solid #35547d; border-radius: 8px; background: #152a47; color: inherit; cursor: pointer; text-align: left; }
    button:hover:not(:disabled) { background: #1c3a64; }
    button:disabled { cursor: wait; opacity: .55; }
    button small { display: block; margin-top: 3px; color: #9fb1cb; }
    #run-automatic { background: #155e75; border-color: #22a1bd; }
    #connection-state { flex: none; padding: 6px 10px; border: 1px solid #35547d; border-radius: 999px; color: #9fb1cb; }
    #connection-state[data-ready="true"] { border-color: #2f9d67; color: #7de0a8; }
    pre { margin-top: 16px; height: 330px; overflow: auto; white-space: pre-wrap; color: #abc5ec; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid #243550; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Deucarian Web Viewer</h1>
      <p>Generated commands through the production iframe transport.</p>
    </div>
    <span id="connection-state" data-ready="false">Connecting</span>
  </header>
  <main>
    <iframe id="viewer" title="Web Viewer"></iframe>
    <aside>
      <div class="toolbar">
        <button id="run-automatic">Run automated scenarios</button>
        <button id="reload-viewer">Reload viewer</button>
      </div>
      <div id="actions" class="actions" aria-label="Generated command scenarios"></div>
      <pre id="events" aria-live="polite"></pre>
    </aside>
  </main>
  <script type="module" src="./harness.js"></script>
</body>
</html>
