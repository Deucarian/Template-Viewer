<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mock Unity Viewer</title>
  <style>
    :root { color-scheme: dark; font: 15px Inter, system-ui, sans-serif; }
    body { display: grid; place-content: center; min-height: 100vh; margin: 0; background: radial-gradient(circle, #173051, #080f1d 62%); color: #e9f1ff; text-align: center; }
    strong { font-size: 24px; }
    p { max-width: 500px; color: #9fb1cb; }
    code { color: #7de0a8; }
  </style>
</head>
<body>
  <main>
    <strong>Mock Unity iframe</strong>
    <p>This local stand-in exercises the same secure parent/iframe command envelope. Start the server with <code>--build</code> to use a real Unity WebGL build.</p>
  </main>
  <script>
    (function () {
      "use strict";
      var transportId = "web-viewer";
      var generation = 1;
      var hostSession = "";
      var lastRevision = 0;

      function send(type, fields) {
        window.parent.postMessage(Object.assign({
          source: "deucarian-command-transport",
          type: type,
          transport_id: transportId,
          connection_generation: generation,
          host_session: hostSession
        }, fields || {}), window.location.origin);
      }

      function response(command, success, code) {
        var message = {
          protocol_version: command.protocol_version || 1,
          command_id: command.command_id || "",
          command: command.command || "",
          success: success
        };
        if (success) message.payload = { mock: true };
        else message.error = { code: code || "mock_failure", message: "Expected mock rejection." };
        send("deucarian-command-response", { message: message });
      }

      function handleCommand(command) {
        var payload = command.payload || {};
        var revision = Number(payload.revision || 0);
        if (revision > 0 && revision < lastRevision) {
          response(command, false, "stale_revision");
          return;
        }
        if (command.command === "select_elements" &&
            Array.isArray(payload.element_ids) &&
            payload.element_ids.indexOf("missing") >= 0) {
          lastRevision = Math.max(lastRevision, revision);
          response(command, false, "unknown_element");
          return;
        }
        if ((command.command === "update_access_token" ||
             command.command === "updateaccesstoken") &&
            !payload.access_token) {
          response(command, false, "invalid_access_token");
          return;
        }
        lastRevision = Math.max(lastRevision, revision);
        response(command, true);
        if (command.command === "initialize_viewer") {
          send("deucarian-command-event", {
            event_name: "viewer_ready",
            payload: { revision: revision, mock: true }
          });
        }
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (event.source !== window.parent ||
            event.origin !== window.location.origin ||
            !data || data.source !== "deucarian-command-host" ||
            data.transport_id !== transportId) return;
        if (data.type === "deucarian-command-probe") {
          if (!data.host_session) return;
          hostSession = data.host_session;
          send("deucarian-command-ready", { ready_kind: "transport" });
          return;
        }
        if (data.type !== "deucarian-command" ||
            data.host_session !== hostSession ||
            data.connection_generation !== generation) return;
        handleCommand(data.message || {});
      }, false);
    })();
  </script>
</body>
</html>
